name: sudo-cry
on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Environment and Install Dependencies
        run: |
          sudo apt-get update -y
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update -y
          sudo apt-get install -y openssh-server git curl software-properties-common
          sudo apt install -y python3.12 python3.12-venv python3.12-dev python3.12-tk python3.12-lib2to3
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
          sudo systemctl enable ssh
          sudo systemctl start ssh

          RDP_USER="${{ secrets.RDP_USER }}"
          RDP_PASS="${{ secrets.RDP_PASS }}"

          if ! id -u "$RDP_USER" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$RDP_USER"
          fi

          echo "$RDP_USER:$RDP_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$RDP_USER"
          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$RDP_USER
          sudo chmod 0440 /etc/sudoers.d/$RDP_USER

      - name: Install Tools
        run: |
          sudo curl -fsSL https://tailscale.com/install.sh | sh
          sudo curl -fsSL https://code-server.dev/install.sh | sh

      - name: Start Tailscale
        run: sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=sudo-cry-${{ github.run_id }} --ssh

      - name: Install and Run Ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update
          sudo apt install -y ngrok

          sudo ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          sudo nohup ngrok http 3000 --url=https://hot-mainly-locust.ngrok-free.app > /dev/null 2>&1 &

      - name: Ensure Code Server Directories
        run: |
          RDP_USER="${{ secrets.RDP_USER }}"
          sudo mkdir -p "/home/$RDP_USER/.local/share/code-server/User"
          sudo mkdir -p "/home/$RDP_USER/.config/code-server"
          sudo chown -R "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.local/share/code-server"
          sudo chown -R "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.config/code-server"

      - name: Install Code Server Extensions
        run: |
          sudo code-server --install-extension golang.go
          sudo code-server --install-extension esbenp.prettier-vscode
          sudo code-server --install-extension ms-python.python
          sudo code-server --install-extension ms-python.debugpy
          sudo code-server --install-extension ms-python.vscode-python-envs
          sudo code-server --install-extension ritwickdey.LiveServer
          sudo code-server --install-extension miguelsolorio.fluent-icons
          sudo code-server --install-extension google.geminicodeassist

      - name: Configure Code Server Settings
        run: |
          RDP_USER="${{ secrets.RDP_USER }}"
          sudo -u "$RDP_USER" mkdir -p "/home/$RDP_USER/.local/share/code-server/User"
          sudo -u "$RDP_USER" tee "/home/$RDP_USER/.local/share/code-server/User/settings.json" > /dev/null <<'EOF'
          {
            "workbench.startupEditor": "none",
            "workbench.welcomePage.enabled": false,
            "workbench.colorTheme": "Default Dark Modern",
            "workbench.statusBar.visible": false,
            "workbench.editorLargeFileConfirmation": 10024,
            "workbench.editor.showTabs": "multiple",
            "workbench.layoutControl.enabled": false,
            "workbench.activityBar.location": "top",
            "workbench.tree.indent": 14,
            "workbench.secondarySideBar.defaultVisibility": "visible",
            "workbench.colorCustomizations": {
              "inlineparameters.annotationBackground": "#282AA3600",
              "inlineparameters.annotationForeground": "#7b82af",
              "scrollbar.shadow": "#24292e00"
            },
            "breadcrumbs.enabled": false,
            "window.menuBarVisibility": "toggle",
            "explorer.confirmDragAndDrop": false,
            "explorer.confirmDelete": true,
            "explorer.confirmPasteNative": false,
            "explorer.compactFolders": false,
            "explorer.sortOrder": "type",
            "files.autoReveal": false,
            "editor.fontFamily": "Cascadia Code, 'Courier New', monospace",
            "editor.fontSize": 16,
            "editor.lineHeight": 1.4,
            "editor.tabSize": 3,
            "editor.detectIndentation": false,
            "editor.formatOnSave": true,
            "editor.formatOnPaste": true,
            "editor.defaultFormatter": "esbenp.prettier-vscode",
            "editor.fontLigatures": "'calt', 'ss01'",
            "editor.glyphMargin": true,
            "editor.folding": true,
            "editor.cursorStyle": "line",
            "editor.minimap.enabled": false,
            "editor.guides.indentation": false,
            "editor.guides.bracketPairs": true,
            "editor.suggestSelection": "first",
            "editor.unicodeHighlight.ambiguousCharacters": false,
            "editor.unicodeHighlight.invisibleCharacters": false,
            "editor.bracketPairColorization.enabled": true,
            "editor.scrollbar": {
              "verticalScrollbarSize": 8,
              "horizontalScrollbarSize": 8
            },
            "diffEditor.codeLens": true,
            "terminal.integrated.fontFamily": "Cascadia Code PL",
            "terminal.integrated.fontSize": 14,
            "terminal.integrated.lineHeight": 1.2,
            "extensions.autoRestart": true,
            "extensions.ignoreRecommendations": true,
            "extensions.closeExtensionDetailsOnViewChange": true,
            "git.autofetch": true,
            "git.enableSmartCommit": true,
            "git.openRepositoryInParentFolders": "never",
            "javascript.updateImportsOnFileMove.enabled": "always",
            "go.toolsManagement.autoUpdate": true,
            "database-client.autoSync": true,
            "update.showReleaseNotes": false
          }
          EOF

      - name: Clone Repository and Enable Auto Sync Setup
        run: |
          RDP_USER="${{ secrets.RDP_USER }}"
          RDP_HOME="/home/$RDP_USER"
          sudo -u "$RDP_USER" git clone https://github.com/smokersaim/chatterbox "$RDP_HOME/chatterbox"
          sudo -u "$RDP_USER" git config --global user.name "Smoker Saim"
          sudo -u "$RDP_USER" git config --global user.email "smoker.saim@gmail.com"

          if [ -n "${{ secrets.REPO_SYNC_TOKEN }}" ]; then
            sudo -u "$RDP_USER" git -C "$RDP_HOME/chatterbox" remote set-url origin https://x-access-token:${{ secrets.REPO_SYNC_TOKEN }}@github.com/smokersaim/chatterbox.git
          fi

          sudo -u "$RDP_USER" nohup bash -c '
          while true; do
            cd /home/$RDP_USER/chatterbox
            git pull --rebase
            if [ -n "$(git status --porcelain)" ]; then
              TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
              git add -A
              git commit -m "Auto sync from code-server at $TIMESTAMP"
              git push origin main || true
            fi
            sleep 60
          done
          ' > /dev/null 2>&1 &

      - name: Start Code Server
        run: |
          RDP_USER="${{ secrets.RDP_USER }}"
          CONFIG_DIR="/home/$RDP_USER/.config/code-server"
          sudo -u "$RDP_USER" mkdir -p "$CONFIG_DIR"
          sudo -u "$RDP_USER" tee "$CONFIG_DIR/config.yaml" > /dev/null <<'EOF'
          bind-addr: 0.0.0.0:3000
          auth: password
          password: password
          cert: false
          EOF
          sudo -u "$RDP_USER" nohup code-server "/home/$RDP_USER/chatterbox" --config "$CONFIG_DIR/config.yaml" > /dev/null 2>&1 &

      - name: Show Access Info
        run: |
          TAILSCALE_IP=$(tailscale ip -4)
          echo "🖥️ Access Information"
          echo "--------------------------------"
          echo "Code Server: https://hot-mainly-locust.ngrok-free.app"
          echo "Auth: password | Password: password"
          echo "Tailscale IP: $TAILSCALE_IP"
          echo "SSH User: ${{ secrets.RDP_USER }}"
          echo "SSH Pass: ${{ secrets.RDP_PASS }}"
          echo "Repo auto-sync: enabled (every 1 min)"
          echo "--------------------------------"

      - name: Keep Alive
        run: sudo sleep 21600
