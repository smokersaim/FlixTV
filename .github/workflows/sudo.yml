name: sudo-cry
on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Environment and Install Dependencies
        run: |
          sudo apt-get update -y
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update -y
          sudo apt-get install -y openssh-server git curl software-properties-common
          sudo apt install -y python3.12 python3.12-venv python3.12-dev python3.12-tk python3.12-lib2to3
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
          sudo systemctl enable ssh
          sudo systemctl start ssh

          RDP_USER="${{ secrets.RDP_USER }}"
          RDP_PASS="${{ secrets.RDP_PASS }}"

          if ! id -u "$RDP_USER" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$RDP_USER"
          fi

          echo "$RDP_USER:$RDP_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$RDP_USER"
          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$RDP_USER
          sudo chmod 0440 /etc/sudoers.d/$RDP_USER

      - name: Install Tools
        run: |
          sudo curl -fsSL https://tailscale.com/install.sh | sh
          sudo curl -fsSL https://code-server.dev/install.sh | sh

      - name: Start Tailscale
        run: sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=sudo-cry-${{ github.run_id }} --ssh

      - name: Install and Run Ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update
          sudo apt install -y ngrok

          sudo ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          sudo nohup ngrok http 3000 --url=https://hot-mainly-locust.ngrok-free.app > /dev/null 2>&1 &

      - name: Install Code Server Extensions
        run: |
          sudo code-server --install-extension golang.go
          sudo code-server --install-extension esbenp.prettier-vscode
          sudo code-server --install-extension ms-python.python
          sudo code-server --install-extension ms-python.debugpy
          sudo code-server --install-extension ms-python.vscode-python-envs
          sudo code-server --install-extension ritwickdey.LiveServer
          sudo code-server --install-extension google.geminicodeassist

      - name: Start Code Server
        run: |
          sudo nohup code-server "/home/$RDP_USER" \
            --bind-addr 0.0.0.0:3000 \
            --auth password \
            --password password \
            --cert false > /dev/null 2>&1 &

      - name: Clone Repository and Enable Auto Sync
        run: |
          RDP_USER="${{ secrets.RDP_USER }}"
          sudo git clone https://github.com/smokersaim/chatterbox /home/$RDP_USER/chatterbox
          sudo git config --global user.name "Smoker Saim"
          sudo git config --global user.email "smoker.saim@gmail.com"
          sudo nohup bash -c '
          while true; do
            cd /home/$RDP_USER/chatterbox
            git pull --rebase
            if [ -n "$(git status --porcelain)" ]; then
              TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
              git add -A
              git commit -m "Auto sync from code-server at $TIMESTAMP"
              git push origin main || true
            fi
            sleep 60
          done
          ' > /dev/null 2>&1 &

      - name: Show Access Info
        run: |
          TAILSCALE_IP=$(tailscale ip -4)
          echo "🖥️ Access Information"
          echo "--------------------------------"
          echo "Code Server: https://hot-mainly-locust.ngrok-free.app"
          echo "Auth: password | Password: password"
          echo "Tailscale IP: $TAILSCALE_IP"
          echo "SSH User: ${{ secrets.RDP_USER }}"
          echo "SSH Pass: ${{ secrets.RDP_PASS }}"
          echo "Repo auto-sync: enabled (every 1 min)"
          echo "--------------------------------"

      - name: Keep Alive
        run: sudo sleep 21600
